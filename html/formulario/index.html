<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário Ingressos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Sorteio do show Justin Bieber</h1>
        <p>Complete o formulário e concorra a ingressos para o show do Justin no Rock in Rio.</p>
        
        <form onsubmit="mostrarAlerta(event)">
            <label>Nome:</label>
            <input type="text" name="nome" required>

            <label>Sobrenome:</label>
            <input type="text" name="sobrenome" required>

            <label>Data:</label>
            <input type="date" name="data">

            <label>Email:</label>
            <input type="email" name="email" required>

            <label>Senha:</label>
            <input type="password" name="senha" required>

            <label>Gênero:</label>
            <div class="radio-group">
                <label><input type="radio" name="genero" value="feminino" required> Feminino</label>
                <label><input type="radio" name="genero" value="masculino" required> Masculino</label>
            </div>

            <label>Ingressos:</label>
            <select name="ingressos" required>
                <option value="">Selecione</option>
                <option value="azul">Setor Azul</option>
                <option value="amarelo">Setor Amarelo</option>
                <option value="vermelho">Setor Vermelho</option>
            </select>

            <button type="submit">Enviar</button>
        </form>
    </div>
</body>

</html>
