<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário Ingressos</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <h1>Sorteio do show Justin Bieber</h1>
    <p>Complete o formulário e concorra a ingressos para o show do Justin no Rock in Rio.</p>

    <form onsubmit="mostrarAlerta(event)">
        <label>Nome:</label>
        <input type="text" name="nome" required>

        <label>Sobrenome:</label>
        <input type="text" name="sobrenome" required>

        <label>Data:</label>
        <input type="date" name="data">

        <label>Email:</label>
        <input type="email" name="email" required>

        <label>Senha:</label>
        <input type="password" name="senha" required>

        <label>Gênero:</label>
        <div class="radio-group">
            <input type="radio" name="genero" value="Feminino" required> Feminino
            <input type="radio" name="genero" value="Masculino" required> Masculino
        </div>

        <label>Ingressos:</label>
        <select name="ingressos" required>
            <option value="">Selecione</option>
            <option>Setor Azul</option>
            <option>Setor Amarelo</option>
            <option>Setor Vermelho</option>
        </select>

        <button type="submit">Enviar</button>
    </form>

    <script>
        function mostrarAlerta(event){
            event.preventDefault();
            alert("Dados cadastrados com sucesso!");
        }
    </script>

</body>
</html>
