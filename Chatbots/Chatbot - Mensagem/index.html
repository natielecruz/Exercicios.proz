<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Chatbot da Enfermagem</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto,
          "Helvetica Neue", Arial;
        background: linear-gradient(180deg, #f7f9fc, #eef3f8);
        display: flex;
        justify-content: center;
        padding: 32px 12px;
        color: #222;
      }

      .container {
        width: 100%;
        max-width: 680px; 
        background: #fff;
        border-radius: 14px;
        box-shadow: 0 10px 30px rgba(20, 20, 40, 0.06);
        padding: 22px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .container h2 {
        font-size: 20px;
        margin-bottom: 6px;
        color: #2b2b2b;
      }

      #chat {
        height: 420px; 
        overflow-y: auto;
        padding: 18px;
        border-radius: 12px;
        background: linear-gradient(180deg, #fbfdff, #f5f8fb);
        border: 1px solid #e6eef7;
        display: flex;
        flex-direction: column;
        gap: 12px; 
      }

      .mensagem-user,
      .mensagem-bot {
        max-width: 80%;
        padding: 12px 16px;
        line-height: 1.45;
        border-radius: 12px;
        word-wrap: break-word;
        white-space: pre-wrap; 
        box-shadow: 0 4px 10px rgba(32, 32, 60, 0.04);
      }

      .mensagem-user {
        align-self: flex-end;
        background: linear-gradient(180deg, #f3eaff, #efe6ff);
        color: #24123a;
        border-bottom-right-radius: 4px; 
      }

      .mensagem-bot {
        align-self: flex-start;
        background: linear-gradient(180deg, #f0f8ff, #eaf6ff);
        color: #063447;
        border-bottom-left-radius: 4px;
      }

      .msg-meta {
        font-size: 12px;
        opacity: 0.65;
        margin-top: 6px;
      }

      .input-row {
        display: flex;
        gap: 10px;
        margin-top: 6px;
      }

      #campoMensagem {
        flex: 1;
        padding: 12px 14px;
        border-radius: 10px;
        border: 1px solid #d6e4ef;
        font-size: 15px;
        outline: none;
        background: #fcfeff;
      }

      button {
        padding: 12px 16px;
        border-radius: 10px;
        background: linear-gradient(180deg, #6d3cff, #4a00d1);
        color: white;
        border: none;
        cursor: pointer;
        min-width: 110px;
        font-weight: 600;
        box-shadow: 0 8px 20px rgba(74, 0, 209, 0.12);
        transition: transform 0.12s ease, box-shadow 0.12s ease;
      }
      button:active {
        transform: translateY(2px);
        box-shadow: 0 4px 10px rgba(74, 0, 209, 0.08);
      }

      #chat {
        scrollbar-width: thin;
        scrollbar-color: #c8d9ee transparent;
      }
      #chat::-webkit-scrollbar {
        width: 8px;
      }
      #chat::-webkit-scrollbar-thumb {
        background: #c8d9ee;
        border-radius: 999px;
      }

      @media (max-width: 480px) {
        .container {
          padding: 16px;
          border-radius: 12px;
        }
        #chat {
          height: 360px;
          padding: 14px;
        }
        button {
          min-width: 90px;
          font-size: 14px;
          padding: 10px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Chatbot da Enfermagem</h2>

      <input id="campoMensagem" placeholder="Digite a mensagem aqui" />
      <button onclick="enviarMensagem()">Enviar</button>

      <div id="chat"></div>
    </div>

    <script src="scripts.js"></script>
  </body>
</html>
